name: SIGMA4 regression checks

on:
  push:
    branches: [sigma4]
  pull_request:
    branches: [sigma4]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify browser 3D and JSON roundtrip
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: node scripts/browser-smoke.mjs
      - name: Save visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigma4-browser-screenshots
          path: artifacts/sigma4-browser/*.png
          if-no-files-found: ignore
